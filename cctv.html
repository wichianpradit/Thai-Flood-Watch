<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCTV ทั่วประเทศ | Thai Flood Watch</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#04101d;color:#edf7ff;font-family:'Noto Sans Thai',sans-serif}header{padding:20px 25px;background:linear-gradient(120deg,#092840,#061524);border-bottom:1px solid #285272;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0}small,.muted{color:#a7bfd1}a{color:#77c9ff}main{padding:20px;max-width:1600px;margin:auto}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}select,input,button{font:inherit;color:#eaf6ff;background:#102d44;border:1px solid #366484;border-radius:9px;padding:10px 13px}input{min-width:240px;flex:1}button{cursor:pointer}#status{font-size:13px;color:#b2c9d8;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.tile{background:#0b2134;border:1px solid #28506b;border-radius:13px;overflow:hidden}.screen{aspect-ratio:16/9;background:#030e19;display:flex;align-items:center;justify-content:center;text-align:center;color:#9eb9cc;font-size:12px}.screen img,.screen video{width:100%;height:100%;object-fit:contain}.details{padding:12px}.details b{font-size:13px;display:block}.details small{display:block;margin:5px 0}.details a{font-size:12px}.hint{background:#10283b;border:1px solid #2a4c64;padding:10px 13px;border-radius:9px;color:#b6d2e5;font-size:12px;margin-bottom:18px}#more{display:none;margin:20px auto}@media(max-width:620px){main{padding:12px}h1{font-size:18px}.grid{grid-template-columns:1fr}}
</style></head><body><header><div><h1>📹 CCTV ทั่วประเทศไทย</h1><small>Thai Flood Watch · รายชื่อกล้องจากแหล่งข้อมูลจริง</small></div><a href="/">← กลับหน้าหลัก</a></header><main><div class="controls"><select id="province"><option value="">ทุกจังหวัด</option></select><input id="search" placeholder="ค้นหาชื่อกล้องหรือสถานที่" aria-label="ค้นหากล้อง"><button id="reload">↻ โหลดข้อมูลใหม่</button></div><div class="hint">แสดงเฉพาะข้อมูลกล้องที่ได้รับจาก API ต้นทาง ภาพอาจไม่พร้อมใช้งานหรือไม่อนุญาตให้ฝังเว็บไซต์ · ไม่มีภาพจำลอง และไม่อ้างว่า LIVE ก่อนตรวจสอบสตรีม</div><div id="status" role="status">กำลังโหลดรายการกล้อง...</div><div id="grid" class="grid"></div><button id="more">แสดงกล้องเพิ่มเติม</button></main><script>
const $=id=>document.getElementById(id);let cameras=[],limit=24;
function media(c,host){const url=c.stream||c.snapshot;if(!url){host.textContent='ไม่มีลิงก์ภาพสำหรับฝัง';return;}const hls=/\.m3u8(?:[?#]|$)/i.test(url),vid=hls||/\.(mp4|webm)(?:[?#]|$)/i.test(url);if(vid){const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='none';if(hls&&!v.canPlayType('application/vnd.apple.mpegurl')){host.textContent='เบราว์เซอร์นี้ยังไม่รองรับ HLS';return;}v.src=url;v.addEventListener('error',()=>{host.textContent='ไม่สามารถเล่นสตรีมนี้ได้';});host.append(v);}else{const img=document.createElement('img');img.alt='ภาพจาก '+c.name;img.loading='lazy';img.onerror=()=>{host.textContent='ไม่สามารถแสดงภาพจากกล้องนี้ได้';};img.src=url;host.append(img);}}
function render(){const p=$('province').value,q=$('search').value.trim().toLocaleLowerCase();const matched=cameras.filter(c=>(!p||(c.province||'ไม่ระบุจังหวัด')===p)&&(!q||(c.name+' '+c.province).toLocaleLowerCase().includes(q)));$('grid').replaceChildren();matched.slice(0,limit).forEach(c=>{const tile=document.createElement('article');tile.className='tile';const screen=document.createElement('div');screen.className='screen';tile.append(screen);media(c,screen);const details=document.createElement('div');details.className='details';const title=document.createElement('b');title.textContent=c.name;details.append(title);const location=document.createElement('small');location.textContent='📍 '+(c.province||'ไม่ระบุจังหวัด');details.append(location);if(c.page){const a=document.createElement('a');a.href=c.page;a.target='_blank';a.rel='noopener noreferrer';a.textContent='ตรวจสอบหน้ากล้องต้นทาง ↗';details.append(a);}tile.append(details);$('grid').append(tile);});$('status').textContent='พบ '+matched.length+' กล้อง · แสดง '+Math.min(limit,matched.length)+' กล้อง · ไม่รับรองว่าทุกกล้องออนไลน์';$('more').style.display=matched.length>limit?'block':'none';}
async function load(){ $('status').textContent='กำลังเชื่อมต่อ ThaiWater...';try{const r=await fetch('/api/cctv/cameras',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'HTTP '+r.status);cameras=Array.isArray(j.cameras)?j.cameras:[];const old=$('province').value;const provinces=[...new Set(cameras.map(c=>c.province||'ไม่ระบุจังหวัด'))].sort((a,b)=>a.localeCompare(b,'th'));$('province').replaceChildren(new Option('ทุกจังหวัด',''),...provinces.map(p=>new Option(p,p)));if(provinces.includes(old))$('province').value=old;limit=24;render();if(!cameras.length)$('status').textContent='API ตอบกลับแล้ว แต่ยังไม่มีรายการกล้องที่ใช้ได้';}catch(e){$('grid').replaceChildren();$('status').textContent='ไม่สามารถโหลดรายการกล้องจริง: '+e.message;}}
$('province').addEventListener('change',()=>{limit=24;render()});$('search').addEventListener('input',()=>{limit=24;render()});$('more').addEventListener('click',()=>{limit+=24;render()});$('reload').addEventListener('click',load);load();
</script></body></html>
