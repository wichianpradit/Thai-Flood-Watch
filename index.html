<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thai Flood Watch V5</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{color-scheme:dark;--bg:#061421;--card:#0c2639;--edge:#20465f;--text:#eaf6ff;--muted:#9eb9cc;--accent:#32b6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Noto Sans Thai',sans-serif}button,input{font:inherit}button{cursor:pointer}.layout{height:100dvh;display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:74px minmax(0,1fr)}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#0a2031;border-bottom:1px solid var(--edge);z-index:20}header h1{margin:0;font-size:24px}header small{color:var(--muted)}aside{grid-column:1;grid-row:2;overflow:auto;padding:14px 10px;background:#081b2c;border-right:1px solid var(--edge)}.nav{width:100%;display:flex;gap:10px;text-align:left;align-items:center;padding:12px 10px;margin:3px 0;background:transparent;border:1px solid transparent;color:var(--text);border-radius:10px}.nav.active,.nav:hover{background:#16548a;border-color:#2875ac}.nav span{font-size:19px}main{grid-column:2;grid-row:2;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 375px;overflow:hidden}.map-wrap{position:relative;min-width:0;min-height:0}#map{height:100%;width:100%;background:#123147}.map-banner{position:absolute;z-index:600;left:12px;top:12px;right:12px;pointer-events:none}.map-banner span{display:inline-block;max-width:100%;background:#071a2eea;border:1px solid #3779a5;border-radius:10px;padding:9px 12px;font-size:12px}.side{overflow-y:auto;padding:14px;background:#071a2a;border-left:1px solid var(--edge)}.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:15px;margin-bottom:12px}.card h2{font-size:18px;margin:0 0 8px}.card p{font-size:13px;color:var(--muted);line-height:1.7}.pill{display:inline-block;border-radius:30px;background:#194865;padding:4px 10px;font-size:11px;color:#bdeaff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.metric{background:#0b324c;padding:11px;border-radius:10px;min-width:0}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:21px;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:12px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tab{border:1px solid #326284;background:#10344e;color:#fff;border-radius:8px;padding:7px 9px;font-size:12px}.tab.active{background:#1679b9}.status{font-size:12px;line-height:1.7;color:#b6d6e8;white-space:pre-wrap}.error{color:#ff9b9b}.chart{width:100%;height:165px;display:block}.chart-label{font-size:11px;color:var(--muted)}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b2b42;color:#fff}.leaflet-popup-content{line-height:1.6}.leaflet-container a.leaflet-popup-close-button{color:#fff} .action{padding:9px 12px;border:1px solid #2d79a5;background:#145c8d;color:white;border-radius:9px}.notice{border-left:3px solid #ffbe56;padding:8px 10px;background:#40321b;color:#ffdda0;font-size:12px}.search{display:flex;gap:8px;margin:12px 0}.search input{min-width:0;width:100%;padding:9px;background:#0a3049;border:1px solid #326284;border-radius:8px;color:white}.list-item{padding:10px 0;border-bottom:1px solid var(--edge);font-size:13px}.footer{font-size:11px;color:#8baac0;margin-top:12px}@media(max-width:1050px){main{grid-template-columns:minmax(0,1fr) 320px}}@media(max-width:760px){.layout{grid-template-columns:1fr;grid-template-rows:65px 65px minmax(0,1fr)}header{grid-column:1;grid-row:1}header h1{font-size:19px}aside{grid-column:1;grid-row:2;display:flex;overflow-x:auto;overflow-y:hidden;gap:5px;padding:7px}.nav{flex:0 0 auto;width:auto;padding:8px;white-space:nowrap;font-size:12px}main{grid-column:1;grid-row:3;grid-template-columns:1fr;grid-template-rows:minmax(240px,46%) minmax(0,1fr)}.side{border-left:0;border-top:1px solid var(--edge)}}
</style></head><body><div class="layout"><header><div><h1>💧 Thai Flood Watch <small>V5</small></h1><small>ศูนย์ข้อมูลสภาพอากาศและน้ำ — แสดงข้อมูลภายในเว็บเดียว</small></div><span id="headerStatus" class="pill">กำลังตรวจสอบ TMD...</span></header><aside id="menu"></aside><main><div class="map-wrap"><div id="map"></div><div class="map-banner"><span id="mapTitle">แผนที่ประเทศไทย • ข้อมูลพยากรณ์ ไม่ใช่เรดาร์สด</span></div></div><section class="side" id="content" aria-live="polite"></section></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const modules=[['overview','⌂','ภาพรวม'],['rain','🌧️','พยากรณ์ฝน'],['risk','⚠️','พื้นที่เสี่ยงน้ำท่วม'],['water','🌿','ระดับน้ำแม่น้ำ'],['tide','🌊','น้ำทะเลหนุน'],['radar','📡','เรดาร์อากาศ'],['marine','💨','ลมและคลื่น'],['cctv','📹','CCTV'],['help','📍','จุดช่วยเหลือ'],['report','📋','รายงานสถานการณ์']];
const $=id=>document.getElementById(id);const state={page:'overview',lat:6.87,lon:101.25,points:[],forecasts:[],forecastTime:null,selectedHour:0,field:'rain',loading:false};
const map=L.map('map',{zoomControl:true}).setView([13.2,101.1],6);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const markers=L.layerGroup().addTo(map);const selectedMarker=L.circleMarker([state.lat,state.lon],{radius:8,color:'#fff',weight:2,fillColor:'#ffbc47',fillOpacity:1}).addTo(map);selectedMarker.bindTooltip('พิกัดที่เลือก');
const n=(x,d=1)=>x===null||x===undefined||x===''||!Number.isFinite(Number(x))?'—':Number(x).toFixed(d);const date=s=>{if(!s)return '—';const d=new Date(s);return Number.isNaN(d.getTime())?'—':d.toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const note='ข้อมูล TMD เป็นพยากรณ์จากแบบจำลอง ไม่ใช่ฝนตกจริงหรือประกาศเตือนภัย';
function nav(){ $('menu').innerHTML=modules.map(([id,icon,label])=>`<button class="nav ${id===state.page?'active':''}" data-page="${id}"><span>${icon}</span>${label}</button>`).join('');$('menu').querySelectorAll('button').forEach(b=>b.onclick=()=>openPage(b.dataset.page));}
function card(title,body){return `<div class="card"><h2>${title}</h2>${body}</div>`};function unavailable(name,detail){return card(name,`<p class="notice">ยังไม่มีแหล่งข้อมูลสดที่เชื่อมและตรวจสอบได้</p><p>${detail}</p><p>ระบบจะไม่แสดงค่าจำลองเป็นข้อมูลจริง</p>`)}
function current(){if(!state.forecasts.length)return null;const now=Date.now();return state.forecasts.find(f=>new Date(f.time).getTime()>=now-30*60000)||state.forecasts[0]}
function metrics(f){const d=f?.data||{};return `<div class="grid"><div class="metric"><small>ฝนพยากรณ์</small><strong>${n(d.rain)} มม.</strong></div><div class="metric"><small>อุณหภูมิ</small><strong>${n(d.tc)} °C</strong></div><div class="metric"><small>ความชื้น</small><strong>${n(d.rh)}%</strong></div><div class="metric"><small>ความเร็วลม</small><strong>${n(d.ws10m)} ม./วินาที</strong></div><div class="metric"><small>ทิศลม</small><strong>${n(d.wd10m,0)}°</strong></div><div class="metric"><small>เวลาในพยากรณ์</small><strong style="font-size:12px">${date(f?.time)}</strong></div></div>`}
function graph(){const fs=state.forecasts.slice(0,24);if(!fs.length)return '<p>รอข้อมูลพยากรณ์</p>';const vals=fs.map(f=>Number(f.data?.[state.field]));const valid=vals.filter(Number.isFinite);const max=Math.max(1,...valid);const width=600,height=155,pad=25;const pts=vals.map((v,i)=>Number.isFinite(v)?`${pad+i*(width-2*pad)/Math.max(1,vals.length-1)},${height-pad-v/max*(height-2*pad)}`:null).filter(Boolean).join(' ');return `<svg class="chart" viewBox="0 0 600 155" role="img" aria-label="กราฟพยากรณ์รายชั่วโมง"><line x1="25" y1="130" x2="575" y2="130" stroke="#47718b"/><line x1="25" y1="25" x2="25" y2="130" stroke="#47718b"/><polyline fill="none" stroke="#45c4ff" stroke-width="3" points="${pts}"/>${vals.map((v,i)=>Number.isFinite(v)?`<circle cx="${pad+i*(width-2*pad)/Math.max(1,vals.length-1)}" cy="${height-pad-v/max*(height-2*pad)}" r="3" fill="#a1e6ff"/>`:'').join('')}<text x="28" y="18" fill="#b5d3e5" font-size="12">สูงสุด ${n(max)}</text></svg><div class="chart-label">${date(fs[0].time)} → ${date(fs[fs.length-1].time)} • หน่วยตามตัวแปรที่เลือก</div>`}
function forecastPage(){const f=current();const tab=[['rain','ฝน'],['tc','อุณหภูมิ'],['rh','ความชื้น'],['ws10m','ลม']];return card(state.page==='overview'?'📊 ภาพรวมพยากรณ์ TMD':'🌧️ พยากรณ์รายชั่วโมง',`<span class="pill">พิกัด ${n(state.lat,3)}, ${n(state.lon,3)}</span><p>${note}</p>${metrics(f)}<div class="tabs">${tab.map(([id,label])=>`<button class="tab ${id===state.field?'active':''}" data-field="${id}">${label}</button>`).join('')}</div>${graph()}<p class="sub">แตะบนแผนที่เพื่อเลือกพิกัดใหม่ • ข้อมูลจะปรับตามตำแหน่ง</p><button class="action" id="refresh">↻ โหลดข้อมูลใหม่</button><div class="footer" id="loadStatus"></div>`)}
function render(){nav();const page=state.page;$('mapTitle').textContent=page==='overview'||page==='rain'||page==='marine'?'แผนที่จุดพยากรณ์ TMD • ไม่ใช่เรดาร์ฝนสด':`แผนที่ประเทศไทย • ${modules.find(m=>m[0]===page)[2]}`;let html='';if(page==='overview'||page==='rain')html=forecastPage();else if(page==='marine')html=forecastPage()+unavailable('🌊 ความสูงคลื่นและคาบคลื่น','มีข้อมูลลม TMD แล้ว แต่ยังไม่มี API ความสูงคลื่นที่ยืนยันการเชื่อมต่อ');else if(page==='water')html=card('🌿 ระดับน้ำแม่น้ำ','<p>ตรวจสอบการเชื่อมต่อข้อมูลสถานีวัดน้ำภายในเว็บ</p><button class="action" id="checkWater">ตรวจสอบ API สถานีวัดน้ำ</button><div class="status" id="waterStatus">ยังไม่ได้ตรวจสอบ</div>')+unavailable('ค่าระดับน้ำรายสถานี','ต้องตรวจสอบหน่วยวัด ตำแหน่ง และเวลาที่วัดจากข้อมูลต้นทางก่อนนำมาแสดง');else if(page==='tide')html=unavailable('🌊 น้ำทะเลหนุน','ต้องเชื่อม API ระดับน้ำทะเลหรือข้อมูลพยากรณ์น้ำขึ้นลงจากแหล่งที่มีสิทธิใช้งาน พร้อมเวลาและสถานีอ้างอิง');else if(page==='radar')html=unavailable('📡 เรดาร์ฝนจริง','ต้องมี URL ภาพเรดาร์หรือบริการชั้นแผนที่ที่อนุญาตให้ฝังในเว็บไซต์ จึงจะแสดงภาพเรดาร์สดในหน้านี้ได้');else if(page==='risk')html=unavailable('⚠️ พื้นที่เสี่ยงน้ำท่วม','ต้องเชื่อมชั้นข้อมูลพื้นที่เสี่ยงที่มีพิกัด และเกณฑ์การเตือนภัยที่ตรวจสอบได้');else if(page==='cctv')html=unavailable('📹 CCTV ทั่วประเทศ','ต้องใช้ URL สตรีมกล้องสาธารณะที่อนุญาตให้ฝังบนเว็บ ไม่สามารถนำลิงก์หน้ากล้องทั่วไปมาเล่นเป็นวิดีโอได้เสมอไป');else if(page==='help')html=unavailable('📍 จุดช่วยเหลือ','ต้องมีฐานข้อมูลพิกัดศูนย์พักพิงและหมายเลขติดต่อที่ตรวจสอบแล้ว');else if(page==='report')html=card('📋 รายงานสถานการณ์',`<p>${note}</p><p>รายงานพยากรณ์จากพิกัดที่เลือก</p>${metrics(current())}`)+unavailable('ประกาศเตือนภัยทางการ','ต้องเชื่อมฟีดประกาศทางการและตรวจสอบเวลาออกประกาศ');$('content').innerHTML=html;document.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{state.field=b.dataset.field;render()});if($('refresh'))$('refresh').onclick=()=>loadLocation(state.lat,state.lon);if($('checkWater'))$('checkWater').onclick=checkWater;setTimeout(()=>map.invalidateSize(),100)}
async function getJSON(url){const r=await fetch(url,{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||`HTTP ${r.status}`);return j}
let seq=0;async function loadLocation(lat,lon){if(!Number.isFinite(lat)||!Number.isFinite(lon))return;state.lat=lat;state.lon=lon;selectedMarker.setLatLng([lat,lon]);const id=++seq;$('headerStatus').textContent='กำลังโหลด TMD...';try{const j=await getJSON(`/api/tmd/weather3hours?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`);if(id!==seq)return;state.forecasts=j.data?.WeatherForecasts?.[0]?.forecasts||[];$('headerStatus').textContent=state.forecasts.length?'TMD • มีข้อมูลพยากรณ์':'TMD • ไม่มีข้อมูล';render()}catch(e){if(id!==seq)return;state.forecasts=[];$('headerStatus').textContent='TMD • โหลดไม่สำเร็จ';render();$('content').insertAdjacentHTML('afterbegin',card('ข้อผิดพลาด',`<p class="error">${esc(e.message)}</p>`))}}
function rainColor(v){return v>=20?'#fa4d5c':v>=10?'#ff9b42':v>=5?'#ead748':v>=1?'#39d9a3':'#40bfff'}async function loadMap(){try{const j=await getJSON('/api/tmd/rain-map');state.points=(j.points||[]).filter(p=>p.forecasts?.length);markers.clearLayers();for(const p of state.points){const f=p.forecasts.find(x=>new Date(x.time).getTime()>=Date.now()-30*60000)||p.forecasts[0];const rain=Number(f?.data?.rain)||0;const m=L.circleMarker([p.lat,p.lon],{radius:8,color:'#fff',weight:1,fillColor:rainColor(rain),fillOpacity:.9}).addTo(markers);m.bindPopup(`<b>พยากรณ์ TMD</b><br>เวลา ${date(f?.time)}<br>ฝน ${n(f?.data?.rain)} มม.<br>อุณหภูมิ ${n(f?.data?.tc)} °C<br><small>ไม่ใช่ฝนที่กำลังตกจริง</small>`,{autoPan:true,autoPanPadding:[40,40]});m.on('click',()=>loadLocation(p.lat,p.lon))}}catch(e){console.warn('Forecast map:',e.message)}}
async function checkWater(){const el=$('waterStatus');if(!el)return;el.textContent='กำลังตรวจสอบ...';try{const r=await fetch('/api/water/stations',{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||`HTTP ${r.status}`);const list=Array.isArray(j.data)?j.data:Array.isArray(j.data?.data)?j.data.data:null;el.textContent=list?`API ตอบกลับ ${list.length} รายการ แต่ยังต้องตรวจสอบชื่อสถานี หน่วยวัด และเวลาของข้อมูลก่อนแสดงค่า`:'API ตอบกลับ แต่ยังไม่ทราบโครงสร้างข้อมูลสถานี';}catch(e){el.textContent='ยังไม่สามารถแสดงระดับน้ำจริง: '+e.message}}
map.on('click',e=>loadLocation(e.latlng.lat,e.latlng.lng));render();loadLocation(state.lat,state.lon);loadMap();setInterval(()=>{loadLocation(state.lat,state.lon);loadMap()},30*60*1000);
</script></body></html>
